name: Model catalog review

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-catalog-review
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install catalog dependencies
        run: pip install 'openai>=2.0,<3' 'anthropic>=0.92,<2' python-dotenv
      - uses: actions/cache/restore@v4
        with:
          path: reports/model-catalog/latest.json
          key: model-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: model-catalog-
      - name: Check provider catalogs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m app.model_catalog
      - name: Publish review summary
        if: always()
        run: |
          if [ -f reports/model-catalog/review.md ]; then
            cat reports/model-catalog/review.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: reports/model-catalog/latest.json
          key: model-catalog-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-catalog-review
          path: reports/model-catalog/
          retention-days: 30
