# Small live-warehouse smoke test; no model is promoted automatically.
- id: rankings
  question: Who are the top 5 players by assists per game?
  expected_tools: [search_rankings]
  expected_terms: [assists]
- id: scoring_trend
  question: Show Tyrese Maxey's scoring trend over his last 10 games.
  expected_tools: [resolve_player, get_player_trends]
  expected_terms: [Maxey]
- id: similarity
  question: Who are the most similar players to Tyrese Maxey?
  expected_tools: [resolve_player, find_similar_players]
  expected_terms: [Maxey, similar]
